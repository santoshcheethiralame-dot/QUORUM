name: daily

# Rebuild every signal after each market closes, save the paper ledger, publish the desk to Pages.
on:
  schedule:
    - cron: "45 10 * * 1-5"   # after India closes (15:30 IST)
    - cron: "15 22 * * 1-5"   # after the US closes (16:00 New York, summer or winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["quorum/**", "site/template.html", "run.py", "requirements.txt", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - run: python -m pytest tests -q
      - run: python run.py
        env:
          QUORUM_NTFY_TOPIC: ${{ secrets.QUORUM_NTFY_TOPIC }}
      - name: Save the paper ledger
        run: |
          git config user.name "quorum-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json data/latest.json data/alert_state.json site/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Daily run $(date -u +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
