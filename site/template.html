<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Quorum desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --plane:#eef2f8; --surface:#ffffff; --surface2:#f6f8fc; --ink:#0f172a; --ink2:#475569; --muted:#94a3b8;
  --grid:#edf1f7; --axis:#d5dce8; --border:rgba(15,23,42,.07); --wash:#f3f6fb;
  --s1:#2563eb; --s2:#f97316; --context:#94a3b8; --long:#2563eb; --short:#ef4444;
  --up:#16a34a; --down:#dc2626; --good:#16a34a; --warn:#f59e0b; --crit:#dc2626;
  --buy:#16a34a; --sell:#dc2626; --hold:#2563eb; --shortv:#ea580c; --watch:#d97706; --wait:#94a3b8;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -12px rgba(15,23,42,.10);
  --lift:0 2px 4px rgba(15,23,42,.05),0 18px 40px -14px rgba(15,23,42,.18);
  --display:"Inter","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --plane:#090e1a; --surface:#111827; --surface2:#162033; --ink:#e6eaf3; --ink2:#a3adc2; --muted:#67718a;
    --grid:#1d273a; --axis:#2b3850; --border:rgba(255,255,255,.07); --wash:#172034;
    --s1:#3b82f6; --s2:#fb923c; --context:#67718a; --long:#3b82f6; --short:#f87171;
    --up:#22c55e; --down:#f87171; --good:#22c55e; --warn:#fbbf24; --crit:#f87171;
    --buy:#16a34a; --sell:#dc2626; --hold:#2563eb; --shortv:#ea580c; --watch:#d97706; --wait:#4b5568;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -12px rgba(0,0,0,.6);
    --lift:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#090e1a; --surface:#111827; --surface2:#162033; --ink:#e6eaf3; --ink2:#a3adc2; --muted:#67718a;
  --grid:#1d273a; --axis:#2b3850; --border:rgba(255,255,255,.07); --wash:#172034;
  --s1:#3b82f6; --s2:#fb923c; --context:#67718a; --long:#3b82f6; --short:#f87171;
  --up:#22c55e; --down:#f87171; --good:#22c55e; --warn:#fbbf24; --crit:#f87171;
  --buy:#16a34a; --sell:#dc2626; --hold:#2563eb; --shortv:#ea580c; --watch:#d97706; --wait:#4b5568;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -12px rgba(0,0,0,.6);
  --lift:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--plane);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-width:1280px;font-feature-settings:"cv11","ss01"}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
a{color:var(--s1);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:6px}
.num,.tk .p,.mini .p,.hero-p,.kpi b{font-variant-numeric:tabular-nums}

/* ---------- rail ---------- */
.rail{background:var(--surface);border-right:1px solid var(--border);padding:22px 14px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 26px;font:800 21px/1 var(--display);letter-spacing:-.03em;color:var(--ink)}
.brand .mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;box-shadow:0 6px 16px -6px #2563eb}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font:500 14px/1.2 var(--body)}
.nav a svg{flex:none;opacity:.8}
.nav a:hover{background:var(--wash);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--s1);color:#fff;font-weight:600;box-shadow:0 8px 18px -8px var(--s1)}
.nav a[aria-current="page"] svg{opacity:1}
.nav .count{margin-left:auto;font:700 11px/1 var(--body);background:var(--sell);color:#fff;border-radius:999px;padding:4px 7px}
.nav a[aria-current="page"] .count{background:#fff;color:var(--s1)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.paper{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px 13px;font-size:12px;color:var(--ink2);line-height:1.45}
.paper b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:2px}
.theme{background:var(--surface2);border:1px solid var(--border);color:var(--ink2);border-radius:10px;padding:8px 10px;font:500 12px var(--body);cursor:pointer;text-align:left}
.theme:hover{color:var(--ink)}

/* ---------- top tape ---------- */
.col{min-width:0;display:flex;flex-direction:column}
.tape{position:sticky;top:0;z-index:15;display:flex;align-items:stretch;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tape::-webkit-scrollbar{display:none}
.tk{flex:none;padding:9px 18px 8px;border-right:1px solid var(--grid);cursor:pointer;min-width:128px}
.tk:hover{background:var(--wash)}
.tk .n{font-size:11px;color:var(--muted);white-space:nowrap;font-weight:500}
.tk .p{font:700 15px/1.3 var(--display);letter-spacing:-.01em}
.tk .c{font-size:11.5px;font-weight:600}
.feed{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;padding:0 18px;font-size:12px;color:var(--ink2);white-space:nowrap;position:sticky;right:0;background:var(--surface);border-left:1px solid var(--grid);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.fu{animation:fu .8s}.fd{animation:fd .8s}
@keyframes fu{0%{background:color-mix(in srgb,var(--up) 30%,transparent)}100%{background:transparent}}
@keyframes fd{0%{background:color-mix(in srgb,var(--down) 30%,transparent)}100%{background:transparent}}

/* ---------- page frame ---------- */
main{padding:26px 30px 90px;width:100%;max-width:1760px}
.page{display:none}
.page.on{display:block}
.page:not(#p-desk){max-width:1240px}
h1{font:800 32px/1.1 var(--display);letter-spacing:-.03em;margin:0 0 6px}
.sub{font:400 16px/1.45 var(--body);color:var(--ink2);margin:0 0 18px;max-width:72ch}
h2{font:700 18px/1.2 var(--display);letter-spacing:-.015em;margin:38px 0 6px}
.lede{color:var(--ink2);margin:0 0 14px;max-width:80ch}
.fine{color:var(--muted);font-size:12.5px}
section.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow)}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13px}
.status svg{flex:none}
.status-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 6px}
.pos{color:var(--up)} .neg{color:var(--down)}
.nm{color:var(--ink2);font-size:12.5px}
.sym{font:700 16px/1.15 var(--display);letter-spacing:-.01em}
.t-main{font-weight:700}
.empty{padding:26px 22px;color:var(--ink2)}

/* ---------- order tickets ---------- */
.tickets{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.ticket{border-top:1px solid var(--grid)}
.ticket:first-child{border-top:0}
.ticket summary{display:grid;grid-template-columns:70px minmax(150px,1.3fr) minmax(130px,1fr) minmax(120px,.9fr) 170px 18px;gap:16px;align-items:center;padding:14px 22px;cursor:pointer;list-style:none}
.ticket summary::-webkit-details-marker{display:none}
.ticket summary:hover{background:var(--wash)}
.side{font:800 13px/1 var(--display);letter-spacing:.06em;padding:8px 0;border-radius:9px;text-align:center;color:#fff}
.side.buy{background:var(--buy)}
.side.sell{background:var(--sell)}
.chev{color:var(--muted);transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.why{padding:0 22px 18px 108px;color:var(--ink2);max-width:90ch}
.why p{margin:0 0 6px}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:600;text-align:left;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--grid);white-space:nowrap;font-size:12px}
td{padding:10px 14px;border-bottom:1px solid var(--grid);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.grouprow td{font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface2);padding:7px 14px}
.cell{display:inline-block;min-width:54px;padding:3px 8px;border-radius:7px;text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--s1) 12%,transparent);color:var(--s1);margin-left:8px}

/* ---------- stat rows ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{padding:18px 20px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
.stat b{display:block;font:800 26px/1.15 var(--display);letter-spacing:-.02em}
.stat span{color:var(--ink2);font-size:12.5px}

/* ---------- exposure bars ---------- */
.xrow{display:grid;grid-template-columns:220px minmax(0,1fr) 70px;gap:14px;align-items:center;padding:5px 0}
.xlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xlabel b{font:700 14px var(--display);margin-right:8px}
.xlabel span{color:var(--ink2);font-size:12.5px}
.xtrack{position:relative;height:16px}
.xtrack::before{content:"";position:absolute;left:50%;top:-5px;bottom:-5px;width:1px;background:var(--axis)}
.xbar{position:absolute;top:2px;height:12px}
.xbar.l{left:50%;background:var(--long);border-radius:0 5px 5px 0}
.xbar.s{right:50%;background:var(--short);border-radius:5px 0 0 5px}
.xval{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.xgroup{font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.xgroup:first-child{margin-top:0}
.key{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink2);font-size:12px;margin:0 0 10px}
.key i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:7px}
.key i.box{height:10px;width:10px;border-radius:3px}

/* ---------- meters ---------- */
.meter{display:grid;grid-template-columns:200px minmax(0,1fr) 170px;gap:16px;align-items:center;padding:9px 0;border-top:1px solid var(--grid)}
.meter:first-child{border-top:0}
.mtrack{height:8px;border-radius:999px;background:var(--grid);overflow:hidden}
.mfill{height:100%;border-radius:999px;background:var(--s1)}
.mfill.warn{background:var(--warn)} .mfill.crit{background:var(--crit)}
.mval{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.mnote{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-4px}

/* ---------- charts ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text,svg.fixed text{font:11px var(--body);fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .endlab{font-size:12px;fill:var(--ink);font-weight:600}
.chart .endlab tspan{fill:var(--ink2);font-weight:400}
svg.fixed{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 12px;font-size:12.5px;box-shadow:var(--lift);white-space:nowrap;z-index:30;display:none}
.tip b{display:block;margin-bottom:3px}
.tip div{display:flex;justify-content:space-between;gap:18px}
.tip i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:7px}
#gtip{position:fixed;max-width:340px;white-space:normal}
.ranges{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--wash);margin:0 0 14px}
.ranges button{border:0;background:none;color:var(--ink2);padding:6px 12px;font:600 12px var(--body);cursor:pointer;border-radius:9px}
.ranges button:hover{color:var(--ink)}
.ranges button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
details.tv{margin-top:10px}
details.tv summary{cursor:pointer;color:var(--ink2);font-size:12.5px}

/* ---------- radar tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.tile .lab{color:var(--ink2);font-size:12.5px;font-weight:500}
.tile .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:4px 0 6px}
.tile .val{font:800 24px/1.1 var(--display);letter-spacing:-.02em}
.tile .st{font-size:12.5px;font-weight:700}
.tile .mean{color:var(--muted);font-size:12px;margin-top:6px}
.heat td,.heat th{padding:5px 6px;text-align:right;font-size:12.5px}
.heat td.y{text-align:left;font-weight:700}
.heat .cell{min-width:46px;padding:3px 6px}
.how{margin-top:18px}
.how summary{cursor:pointer;color:var(--ink2)}
.how ol{margin:8px 0 0;padding-left:20px;color:var(--ink2);max-width:70ch}

/* ---------- desk grid + cards ---------- */
.desk{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:18px 20px;min-width:0;box-shadow:var(--shadow);position:relative}
.card h3{font:700 15px/1.2 var(--display);letter-spacing:-.01em;color:var(--ink);margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h3 a,.card h3>span{font:500 12.5px var(--body);letter-spacing:0;color:var(--ink2)}
.card h3 a{color:var(--s1);font-weight:600}
.c12{grid-column:span 12}.c9{grid-column:span 9}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.mk{font:700 11px/1.2 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pill{font:600 10.5px/1 var(--body);letter-spacing:0;text-transform:none;border-radius:999px;padding:4px 8px;margin-left:6px;color:var(--ink2);background:var(--wash);white-space:nowrap}
.cpill{display:inline-flex;align-items:center;gap:4px;font:700 12px/1 var(--body);border-radius:999px;padding:5px 9px}
.cpill.pos{background:color-mix(in srgb,var(--up) 13%,transparent)}
.cpill.neg{background:color-mix(in srgb,var(--down) 13%,transparent)}

/* greeting row */
.hello{grid-column:span 12;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:2px}
.hello .hi{font:500 13px var(--body);color:var(--muted)}
.hello h1{margin:2px 0 0}
.hello .right{display:flex;gap:10px;align-items:center;color:var(--ink2);font-size:12.5px}

/* account card */
.acct{background:linear-gradient(150deg,#2563eb 0%,#1e40af 100%);color:#fff;border:0;overflow:hidden}
.acct::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.acct .mk{color:rgba(255,255,255,.7)}
.acct .big{font:800 34px/1.05 var(--display);letter-spacing:-.03em;margin:6px 0 4px}
.acct .big small{font-size:20px;opacity:.6}
.acct .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acct .chipw{font:600 11.5px/1 var(--body);background:rgba(255,255,255,.14);border-radius:999px;padding:6px 9px}
.acct .fine{color:rgba(255,255,255,.7)}
.acct svg{display:block;margin-top:10px}

/* regime mini */
.rmini{cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s,transform .15s}
.rmini:hover{box-shadow:var(--lift);transform:translateY(-1px)}
.rmini .top{display:flex;justify-content:space-between;align-items:center}
.rmini .lbl{font:800 26px/1 var(--display);letter-spacing:-.02em;color:var(--lvl);display:flex;align-items:center;gap:10px}
.rmini .lbl i{width:34px;height:34px;border-radius:11px;background:color-mix(in srgb,var(--lvl) 14%,transparent);display:grid;place-items:center}
.rmini .act{font-size:12.5px;color:var(--ink2)}
.score{position:relative;width:46px;height:46px;flex:none}
.score b{position:absolute;inset:0;display:grid;place-items:center;font:800 13px var(--display)}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.ladder span{height:6px;border-radius:999px;background:var(--grid);font-size:0}
.ladder span.on{background:var(--lvl)}
.reg .ladder span{height:auto;font-size:11px;text-align:center;padding:5px 2px;border-radius:7px;background:var(--wash);color:var(--muted);font-weight:500}
.reg .ladder span.on{background:var(--lvl);color:#fff;font-weight:700}
.lad-k{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:-3px}

/* regime card (Regime page) */
.reg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 16px;align-items:center;align-content:start}
.reg .badge{width:58px;height:58px;border-radius:16px;background:var(--lvl);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px -10px var(--lvl)}
.reg .lbl{font:800 34px/1.05 var(--display);letter-spacing:-.02em;margin:3px 0 2px;color:var(--lvl)}
.reg.sm .lbl{font-size:26px}
.reg .act{font-weight:600}
.reg .more{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:5px 10px;background:var(--wash);white-space:nowrap;font-weight:500}
.chip svg{flex:none}

/* ---------- THE CALLS board ---------- */
.calls-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px}
.calls-head h3{margin:0;font-size:20px}
.calls-head .say{font-size:14px;color:var(--ink2);margin-top:4px;max-width:70ch}
.calls-head .say b{color:var(--ink)}
.vk{display:flex;gap:8px}
.vk div{min-width:84px;padding:10px 12px 9px;border-radius:14px;background:var(--wash);text-align:left}
.vk div b{display:block;font:800 26px/1 var(--display);letter-spacing:-.02em}
.vk div span{font:800 10.5px/1 var(--display);letter-spacing:.12em;color:var(--muted)}
.vk div.hot{background:var(--v);color:#fff;box-shadow:0 10px 22px -10px var(--v)}
.vk div.hot span{color:rgba(255,255,255,.85)}
.board-ctl{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.board-ctl .ranges{margin:0}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.more-btn{margin:14px auto 0;display:block;background:var(--wash);color:var(--ink);border:0;border-radius:12px;padding:9px 18px;font:600 12.5px var(--body);cursor:pointer}
.more-btn:hover{background:var(--grid)}
.vt{--v:var(--wait);border:1px solid var(--border);border-radius:18px;padding:14px 14px 12px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;min-width:0}
.vt::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--v)}
.vt:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.vt.buy{--v:var(--buy)}.vt.sell{--v:var(--sell)}.vt.hold{--v:var(--hold)}.vt.short{--v:var(--shortv)}.vt.watch{--v:var(--watch)}
.vt-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

<script>
const D = /*__DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dt = s => new Date(s + 'T00:00:00');
const fdate = s => { const d = dt(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const fshort = s => { const d = dt(s); return DOW[d.getDay()].slice(0,3) + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const pct = (x, dp = 1) => (x * 100).toFixed(dp) + '%';
const spct = (x, dp = 1) => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x * 100).toFixed(dp) + '%';
const snum = (x, dp = 0) => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(dp);
const money = x => '$' + Math.round(x).toLocaleString('en-US');
const qty = x => x >= 100 ? Math.round(x).toLocaleString('en-US') : x >= 1 ? x.toFixed(1) : x.toFixed(3);
const cls = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const mix = (v, x, max) => { const a = Math.min(Math.abs(x) / max, 1) * 46; return a < 2 ? 'transparent' : `color-mix(in srgb, var(${x > 0 ? '--up' : '--down'}) ${a.toFixed(0)}%, transparent)`; };

/* ---------- vote strip: every strategy's vote as a dot, the net as a bar ---------- */
function strip(r, w = 150) {
  const h = 26, mid = w / 2, sc = v => mid + Math.max(-20, Math.min(20, v)) / 20 * (mid - 6);
  const x = sc(r.net), bx = Math.min(mid, x), bw = Math.abs(x - mid);
  const live = Object.entries(r.votes), shadow = Object.entries(r.shadow || {});
  const tip = live.map(([k, v]) => D.sleeve_labels[k] + ' ' + snum(v)).join(', ')
    + (shadow.length ? '. Shadow: ' + shadow.map(([k, v]) => D.sleeve_labels[k] + ' ' + snum(v)).join(', ') : '')
    + '. Net ' + snum(r.net);
  const bar = bw < 1 ? '' : r.net > 0
    ? `<path d="M${mid} 13h${bw - 4}a4 4 0 0 1 4 4v0a4 4 0 0 1-4 4H${mid}z" fill="var(--long)"/>`
    : `<path d="M${mid} 13H${bx + 4}a4 4 0 0 0-4 4v0a4 4 0 0 0 4 4H${mid}z" fill="var(--short)"/>`;
  return `<svg class="strip" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" data-tip="${esc(tip)}" role="img" aria-label="${esc(tip)}">
    <line x1="6" x2="${w - 6}" y1="6" y2="6" stroke="var(--grid)"/>
    <line x1="${mid}" x2="${mid}" y1="1" y2="${h - 2}" stroke="var(--axis)"/>
    ${bar}
    ${shadow.map(([k, v]) => `<circle cx="${sc(v)}" cy="6" r="3" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>`).join('')}
    ${live.map(([k, v]) => `<circle cx="${sc(v)}" cy="6" r="4" fill="var(--ink2)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
  </svg>`;
}

/* ---------- line chart with crosshair, tooltip, end labels ---------- */
function ticks(lo, hi, n = 4) {
  const span = hi - lo || 1, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function lineChart(el, cfg0) {
  const draw = () => {
    const W = el.clientWidth || 600, H = cfg0.height || 260;
    const m = { l: 46, r: cfg0.endLabels === false ? 14 : 118, t: 12, b: 26 };
    const iw = Math.max(40, W - m.l - m.r), ih = H - m.t - m.b;
    const step = Math.max(1, Math.ceil(cfg0.dates.length / (iw * 1.5)));
    const pick = a => step === 1 ? a : a.filter((_, i) => (a.length - 1 - i) % step === 0);
    const cfg = Object.assign({}, cfg0, { dates: pick(cfg0.dates), series: cfg0.series.map(s => Object.assign({}, s, { values: pick(s.values) })) });
    const n = cfg.dates.length;
    let lo = Infinity, hi = -Infinity;
    cfg.series.forEach(s => s.values.forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
    if (cfg.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    const pad = (hi - lo) * 0.06 || 1; lo -= cfg.zero && lo === 0 ? 0 : pad; hi += cfg.zero && hi === 0 ? 0 : pad;
    const tk = ticks(lo, hi), X = i => m.l + (n < 2 ? iw / 2 : i / (n - 1) * iw), Y = v => m.t + (1 - (v - lo) / (hi - lo)) * ih;
    const yf = cfg.yFmt || (v => v.toLocaleString('en-US'));
    let g = tk.map(v => `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(${v === 0 && cfg.zero ? '--axis' : '--grid'})"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${yf(v)}</text>`).join('');
    const years = (dt(cfg.dates[n - 1]) - dt(cfg.dates[0])) / 31557600000;
    let last = null, lastX = -99;
    for (let i = 0; i < n; i++) {
      const d = dt(cfg.dates[i]), key = years > 2.2 ? d.getFullYear() : d.getFullYear() * 12 + d.getMonth();
      if (last !== null && key !== last) {
        const every = years > 9 ? 2 : 1;
        const lab = years > 2.2 ? (d.getFullYear() % every === 0 ? d.getFullYear() : '') : MON[d.getMonth()] + (d.getMonth() === 0 ? ' ' + d.getFullYear() : '');
        if (lab !== '' && X(i) - lastX > 44 && X(i) < m.l + iw - 16) { g += `<text x="${X(i)}" y="${H - 7}" text-anchor="middle">${lab}</text>`; lastX = X(i); }
      }
      last = key;
    }
    let paths = '';
    cfg.series.forEach(s => {
      let d = '', started = false;
      s.values.forEach((v, i) => { if (v == null) return; d += (started ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); started = true; });
      if (s.area) paths += `<path d="${d}L${X(n - 1)} ${Y(Math.max(lo, Math.min(hi, 0)))}L${X(0)} ${Y(Math.max(lo, Math.min(hi, 0)))}Z" fill="var(${s.color})" opacity=".10"/>`;
      paths += `<path d="${d}" fill="none" stroke="var(${s.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    });
    let ends = '';
    if (cfg.endLabels !== false) {
      const pts = cfg.series.map(s => ({ s, v: s.values[n - 1], y: Y(s.values[n - 1]) })).sort((a, b) => a.y - b.y);
      for (let i = 1; i < pts.length; i++) if (pts[i].y - pts[i - 1].y < 30) pts[i].ly = (pts[i - 1].ly || pts[i - 1].y) + 30;
      pts.forEach(p => {
        const ly = p.ly || p.y;
        ends += `<circle cx="${X(n - 1)}" cy="${p.y}" r="4" fill="var(${p.s.color})" stroke="var(--surface)" stroke-width="2"/>`;
        if (Math.abs(ly - p.y) > 2) ends += `<line x1="${X(n - 1) + 5}" y1="${p.y}" x2="${X(n - 1) + 11}" y2="${ly - 4}" stroke="var(--axis)"/>`;
        ends += `<text class="endlab" x="${X(n - 1) + 12}" y="${ly - 1}">${esc(p.s.name)}<tspan x="${X(n - 1) + 12}" dy="14">${(cfg.vFmt || yf)(p.v)}</tspan></text>`;
      });
    }
    const hov = cfg.series.map((s, k) => `<circle class="hd" data-k="${k}" r="4.5" fill="var(${s.color})" stroke="var(--surface)" stroke-width="2" style="display:none"/>`).join('');
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(cfg.label || '')}" tabindex="0">${g}${paths}${ends}
      <line class="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--axis)" style="display:none"/>${hov}
      <rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip"></div>`;
    const svg = $('svg', el), tip = $('.tip', el), xh = $('.xh', el), dots = [...el.querySelectorAll('.hd')];
    let cur = n - 1;
    const show = i => {
      cur = Math.max(0, Math.min(n - 1, i));
      xh.style.display = ''; xh.setAttribute('x1', X(cur)); xh.setAttribute('x2', X(cur));
      dots.forEach((c, k) => { const v = cfg.series[k].values[cur]; if (v == null) { c.style.display = 'none'; return; } c.style.display = ''; c.setAttribute('cx', X(cur)); c.setAttribute('cy', Y(v)); });
      tip.innerHTML = `<b>${fdate(cfg.dates[cur])}</b>` + cfg.series.map(s => `<div><span><i style="background:var(${s.color})"></i>${esc(s.name)}</span><span class="num">${s.values[cur] == null ? '' : (cfg.vFmt || yf)(s.values[cur])}</span></div>`).join('');
      tip.style.display = 'block';
      const left = X(cur) + 14 + tip.offsetWidth > W ? X(cur) - 14 - tip.offsetWidth : X(cur) + 14;
      tip.style.left = Math.max(0, left) + 'px'; tip.style.top = m.t + 'px';
    };
    const hide = () => { xh.style.display = 'none'; dots.forEach(c => c.style.display = 'none'); tip.style.display = 'none'; };
    svg.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); show(Math.round((e.clientX - r.left - m.l) / iw * (n - 1))); });
    svg.addEventListener('pointerleave', hide);
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1); });
  };
  draw();
  if (!el._ro) { let t; el._ro = new ResizeObserver(() => { clearTimeout(t); t = setTimeout(() => el._redraw && el._redraw(), 120); }); el._ro.observe(el); }
  el._redraw = draw;
}
function legend(series) {
  return `<div class="key">${series.map(s => `<span><i style="background:var(${s.color})"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function spark(vals, w = 110, h = 34) {
  const lo = Math.min(...vals), hi = Math.max(...vals), n = vals.length;
  const X = i => 3 + i / (n - 1) * (w - 9), Y = v => 4 + (1 - (v - lo) / (hi - lo || 1)) * (h - 8);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('')}" fill="none" stroke="var(--context)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(n - 1)}" cy="${Y(vals[n - 1])}" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}

function limitBoard() {

function scoreRing(score, color) {

function acctCard() {

  const w = 300, h = 54, lo = Math.min(...seg), hi = Math.max(...seg);
  const d = seg.map((v, i) => (i ? 'L' : 'M') + (i / (seg.length - 1) * w).toFixed(1) + ' ' + (4 + (1 - (v - lo) / (hi - lo || 1)) * (h - 8)).toFixed(1)).join('');

    <div class="row"><span class="chipw">Rules, past year ${spct(chg)}</span><span class="chipw">${pct(D.book.long, 0)} long</span><span class="chipw">${pct(D.book.short, 0)} short</span></div></section>`;

function donut() {
  const G = D.group_order.map(g => {
    const ws = D.signals.filter(s => s.group === g).map(s => s.target_w);
    return { g, gross: ws.reduce((a, b) => a + Math.abs(b), 0), net: D.book.by_group[g] };
  }).filter(x => x.gross > 0.0005);
  const tot = G.reduce((a, b) => a + b.gross, 0), R = 64, r = 46, cx = 80, cy = 80;
  let a0 = -Math.PI / 2, arcs = '';
  G.forEach(x => {
    const a1 = a0 + x.gross / tot * Math.PI * 2, big = a1 - a0 > Math.PI ? 1 : 0, gap = 0.012;
    const p = (rad, a) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)].map(v => v.toFixed(2)).join(' ');
    arcs += `<path d="M${p(R, a0 + gap)}A${R} ${R} 0 ${big} 1 ${p(R, a1 - gap)}L${p(r, a1 - gap)}A${r} ${r} 0 ${big} 0 ${p(r, a0 + gap)}Z" fill="${GCOL[x.g]}" data-tip="${esc(cap(x.g))}: ${pct(x.gross / tot, 0)} of exposure, net ${spct(x.net)}"/>`;
    a0 = a1;
  });
  return `<div class="alloc"><svg viewBox="0 0 160 160" width="160" height="160" class="fixed">${arcs}
      <text x="80" y="76" text-anchor="middle" style="font:800 22px var(--display);fill:var(--ink)">${pct(D.book.gross, 0)}</text>
      <text x="80" y="95" text-anchor="middle">total exposure</text></svg>
    <div class="glist">${G.map(x => `<div><i style="background:${GCOL[x.g]}"></i><span>${cap(x.g)}</span><b class="${cls(x.net)}">${spct(x.net)}</b></div>`).join('')}</div></div>
    <div class="lsbar"><i style="width:${(D.book.long / D.book.gross * 100).toFixed(1)}%;background:var(--long)"></i><i style="width:${(D.book.short / D.book.gross * 100).toFixed(1)}%;background:var(--short)"></i></div>
    <div class="lsk"><span>Long ${pct(D.book.long, 0)}</span><span>Short ${pct(D.book.short, 0)}</span></div>`;
}

function histo() {
  const ret = a => a.slice(1).map((v, i) => v / a[i] - 1);
  const A = ret(D.sim.strategy), B = ret(D.sim.benchmark), lo = -0.03, step = 0.002, nb = 30;
  const bin = arr => { const c = new Array(nb).fill(0); arr.forEach(x => { c[Math.max(0, Math.min(nb - 1, Math.floor((x - lo) / step)))]++; }); return c.map(v => v / arr.length); };
  const a = bin(A), b = bin(B), mx = Math.max(...a, ...b), W = 520, H = 190, m = { l: 8, r: 8, t: 10, b: 24 }, bw = (W - m.l - m.r) / nb;
  const Y = v => m.t + (1 - v / mx) * (H - m.t - m.b);
  let s = '';
  a.forEach((v, i) => { s += `<rect x="${(m.l + i * bw + 1.5).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw - 3).toFixed(1)}" height="${(H - m.b - Y(v)).toFixed(1)}" rx="3" fill="${lo + i * step < 0 ? 'var(--down)' : 'var(--up)'}" opacity=".85" data-tip="${(lo + i * step) * 100 > 0 ? '+' : ''}${((lo + i * step) * 100).toFixed(1)}% to ${((lo + (i + 1) * step) * 100).toFixed(1)}%: Quorum ${pct(v, 1)} of days, US stocks ${pct(b[i], 1)}"/>`; });
  let path = ''; b.forEach((v, i) => { path += (i ? 'L' : 'M') + (m.l + i * bw).toFixed(1) + ' ' + Y(v).toFixed(1) + 'H' + (m.l + (i + 1) * bw).toFixed(1); });
  s += `<path d="${path}" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  [-0.03, -0.02, -0.01, 0, 0.01, 0.02, 0.03].forEach(x => { const X = m.l + (x - lo) / step * bw; s += `<text x="${X}" y="${H - 6}" text-anchor="middle">${x === 0 ? '0' : (x > 0 ? '+' : '−') + Math.abs(x * 100) + '%'}</text>`; });
  s += `<line x1="${m.l + (0 - lo) / step * bw}" x2="${m.l + (0 - lo) / step * bw}" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)"/>`;
  return `<svg class="fixed" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

function monthsGrid() {

}

  const flags = stockRows().filter(x => x[2].status === 'BUY' || x[2].status === 'SELL').length;
  const badge = { desk: flags, orders: D.tickets.length };
  $('#nav').innerHTML = PAGES.map(x => `<a href="#${x[0]}" title="${x[1]}" ${x[0] === p[0] ? 'aria-current="page"' : ''}>${NAVI[x[0]]}<span>${x[1]}</span>${badge[x[0]] ? `<span class="count">${badge[x[0]]}</span>` : ''}</a>`).join('');
  p[2](); repaint();
  window.scrollTo(0, 0);
}
$('#foot').textContent = 'Signals from ' + fshort(D.meta.last_bar) + "'s close. Paper trading only.";
const TH = ['auto', 'light', 'dark'];
let th = 'auto'; try { th = localStorage.getItem('quorum-theme') || 'auto'; } catch (e) {}
function applyTheme() { if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th); $('#theme').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg><span>Theme: ' + th + '</span>'; drawAll(); }
$('#theme').addEventListener('click', () => { th = TH[(TH.indexOf(th) + 1) % 3]; try { localStorage.setItem('quorum-theme', th); } catch (e) {} applyTheme(); });
const gt = $('#gtip');
document.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { gt.style.display = 'none'; return; }
  gt.textContent = t.getAttribute('data-tip'); gt.style.display = 'block';
  gt.style.left = Math.min(window.innerWidth - gt.offsetWidth - 8, e.clientX + 14) + 'px'; gt.style.top = (e.clientY + 16) + 'px';
});
document.addEventListener('click', e => { const t = e.target.closest('[data-hero]'); if (t && !e.target.closest('a,button,select')) setHero(t.dataset.hero); });
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { drawAll(); limitBoard(); });
let RAIL = false; try { RAIL = localStorage.getItem('quorum-rail') === '1'; } catch (e) {}
function applyRail() { $('.app').classList.toggle('collapsed', RAIL); $('#collapse').setAttribute('aria-expanded', String(!RAIL)); $('#collapse').title = (RAIL ? 'Expand' : 'Collapse') + ' sidebar ( [ )'; }
$('#collapse').addEventListener('click', () => { RAIL = !RAIL; try { localStorage.setItem('quorum-rail', RAIL ? '1' : '0'); } catch (e) {} applyRail(); });
$('.app').addEventListener('transitionend', e => { if (e.propertyName === 'grid-template-columns') { drawAll(); limitBoard(); } });
document.addEventListener('keydown', e => { if (e.key === '[' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) $('#collapse').click(); });
applyRail();
tape(); applyTheme(); route(); connect(); feedStatus();
setInterval(everySecond, 1000);
</script>
</body>
